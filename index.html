
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MADGEK</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px 18px;background:#100e16;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:24px 0}
h1{color:#e7c66b;letter-spacing:6px;font-size:36px}
.card{background:#211c2b;border:1px solid #493b50;border-radius:18px;padding:22px;margin-bottom:16px}
.balance{text-align:center}
.coins{font-size:32px;color:#e7c66b}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{text-align:center}
button{width:100%;padding:14px 8px;border:0;border-radius:12px;background:#e7c66b;color:#17121b;font-size:15px;font-weight:bold}
#result{text-align:center;color:#e7c66b;min-height:24px}
small,footer{color:#aaa;font-size:12px}
footer{text-align:center;margin-top:28px}
</style>
</head>
<body>
<header>
<h1>MADGEK</h1>
<p>ТВОЯ ИГРОВАЯ ЗОНА</p>
</header>
<section class="card balance">
<p>ТЕСТОВЫЙ БАЛАНС</p>
<div class="coins">🪙 <span id="balance">1000</span></div>
<small>Виртуальные монеты без денежной стоимости</small>
</section>
<div class="games">
<section class="card game">
<h3>🎰 Слоты</h3>
<button onclick="play()">Играть</button>
</section>
<section class="card game">
<h3>🎲 Кубик</h3>
<button onclick="roll()">Бросить</button>
</section>
</div>
<p id="result">Добро пожаловать в MADGEK!</p>
<footer>Демонстрационная игра · Без денежных ставок</footer>
<script>
const tg=window.Telegram?.WebApp;
tg?.ready();
tg?.expand();
let balance=1000;
function play(){
if(balance<10){
document.getElementById('result').textContent='Монеты закончились!';
return;
}
balance-=10;
const win=Math.random()<0.3;
if(win)balance+=25;
document.getElementById('balance').textContent=balance;
document.getElementById('result').textContent=win?'✨ Тестовый выигрыш: 25 монет!':'Попробуй ещё раз!';
}
function roll(){
const number=Math.floor(Math.random()*6)+1;
document.getElementById('result').textContent='Выпало: '+number;
}
</script>
</body>
</html>
