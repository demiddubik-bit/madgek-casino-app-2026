<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>MADGEK | Casino Club</title>
<style>
:root {
  --bg: #08090d;
  --panel: #141620;
  --line: #303343;
  --gold: #f2cb78;
  --muted: #969bad;
  --green: #40d7a0;
  --red: #f06b7c;
  --gold-grad: linear-gradient(135deg, #fff0bd, #d6a447, #b47b2c);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 50% 0, #392a1a 0, transparent 45%), var(--bg);
  color: #f5f3ed;
  font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  min-height: 100vh;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; transition: .18s; }
button:disabled { opacity: .45; cursor: not-allowed; }
.app { max-width: 1350px; margin: auto; padding: 0 18px 100px; }

/* Header */
header {
  height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid #ffffff17;
  position: sticky;
  top: 0;
  background: #090a0eee;
  backdrop-filter: blur(18px);
  z-index: 20;
}
.brand {
  font-size: 22px;
  font-weight: 950;
  letter-spacing: 3px;
  white-space: nowrap;
}
.brand i {
  font-style: normal;
  color: #21180b;
  background: var(--gold-grad);
  padding: 9px;
  border-radius: 10px;
  margin-right: 7px;
  display: inline-block;
}
nav { display: flex; gap: 4px; }
nav button, .mobile button {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 10px 12px;
  border-radius: 9px;
  font-weight: 600;
}
nav button.active, .mobile button.active {
  color: var(--gold);
  background: #ffffff0d;
}
.right { display: flex; align-items: center; gap: 8px; }
.balance {
  border: 1px solid #6b532c;
  background: #17150f;
  padding: 8px 12px;
  border-radius: 10px;
  white-space: nowrap;
}
.balance b { color: var(--gold); font-size: 16px; }
.balance small { display: block; color: var(--muted); font-size: 10px; }

select, input, textarea {
  background: #0c0e15;
  color: #fff;
  border: 1px solid #373b4d;
  border-radius: 9px;
  padding: 10px;
  max-width: 100%;
}
button.primary {
  border: 1px solid #ffe6a3;
  background: var(--gold-grad);
  color: #201707;
  border-radius: 10px;
  padding: 12px 16px;
  font-weight: 850;
}
button.primary:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
button.secondary {
  background: #171923;
  color: #eee;
  border: 1px solid #36394a;
  border-radius: 10px;
  padding: 10px 14px;
}
button.secondary:hover:not(:disabled) { background: #1e2130; }

/* Pages */
.page { display: none; }
.page.active { display: block; animation: fade .25s ease; }
@keyframes fade {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

/* Hero */
.hero {
  margin: 24px 0;
  border: 1px solid #5c4729;
  border-radius: 22px;
  padding: 36px;
  background: linear-gradient(115deg, #282016, #17151d 60%, #10121a);
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: "✦";
  position: absolute;
  right: 5%;
  top: -70px;
  font-size: 260px;
  color: #dcb66b12;
  pointer-events: none;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 2.5px;
  color: var(--gold);
  font-weight: 900;
  text-transform: uppercase;
}
h1 {
  font-size: clamp(36px, 5vw, 58px);
  line-height: 1.05;
  margin: 14px 0;
}
h2 { font-size: 22px; margin: 0; }
h3 { margin: 0 0 10px; }
.gold { color: var(--gold); }
.hero p { color: #bbb9c4; max-width: 540px; line-height: 1.65; }

.sectionhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 28px 0 14px;
}
.muted { color: var(--muted); }

/* Filters & Games */
.filters { display: flex; gap: 8px; overflow: auto; margin: 14px 0; padding-bottom: 4px; }
.chip {
  border: 1px solid var(--line);
  background: #12141c;
  color: var(--muted);
  padding: 8px 14px;
  border-radius: 30px;
  white-space: nowrap;
  font-weight: 600;
}
.chip.active {
  border-color: #987440;
  color: var(--gold);
  background: #302619;
}
.games {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
}
.game {
  background: linear-gradient(145deg, #1b1d28, #101118);
  border: 1px solid #303343;
  border-radius: 16px;
  overflow: hidden;
  transition: .22s;
}
.game:hover {
  transform: translateY(-4px);
  border-color: #967440;
  box-shadow: 0 12px 30px #0006;
}
.art {
  height: 140px;
  display: grid;
  place-items: center;
  background: radial-gradient(circle, #594127, #1a1821 70%);
  font-size: 58px;
  position: relative;
}
.art::before {
  content: "";
  position: absolute;
  width: 115px;
  height: 115px;
  border: 1px solid #f2cb7830;
  border-radius: 50%;
}
.gameinfo { padding: 14px; }
.gameinfo p { font-size: 12px; color: var(--muted); min-height: 36px; margin: 6px 0 12px; }
.gameinfo button { width: 100%; }

/* Stats */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 20px 0;
}
.stat {
  background: #11131b;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
}
.stat span { display: block; font-size: 11px; color: var(--muted); }
.stat b { display: block; font-size: 19px; color: var(--gold); margin-top: 5px; }

/* Layout for games */
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(270px, .7fr);
  gap: 16px;
  margin-top: 18px;
}
.stage, .controls, .panel {
  background: linear-gradient(150deg, #191b26, #101118);
  border: 1px solid #303343;
  border-radius: 18px;
  padding: 20px;
  min-width: 0;
}
.stagehead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.arena {
  min-height: 360px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  text-align: center;
  overflow: hidden;
}
.result {
  font-size: 17px;
  font-weight: 850;
  color: var(--gold);
  min-height: 26px;
  transition: .2s;
}
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 13px 0;
}
.row label { font-size: 12px; color: #c3c6d3; }
.field { width: 130px; }
.wide { width: 100%; margin-top: 10px; }
.types {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}
.type {
  background: #0b0d13;
  border: 1px solid #373a4a;
  border-radius: 9px;
  padding: 10px 4px;
  color: #b9bdce;
  font-size: 12px;
  font-weight: 600;
}
.type.active {
  border-color: var(--gold);
  color: var(--gold);
  background: #332817;
}

/* Roulette */
.wheelwrap {
  width: min(400px, 78vw);
  aspect-ratio: 1;
  position: relative;
  margin: 10px auto;
}
.pointer {
  position: absolute;
  z-index: 4;
  top: -5px;
  left: 50%;
  transform: translateX(-50%);
  border-left: 13px solid transparent;
  border-right: 13px solid transparent;
  border-top: 30px solid #ffe6a3;
  filter: drop-shadow(0 3px 4px #000);
}
.wheel {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 9px solid #c49a4d;
  box-shadow: 0 0 0 4px #473219, 0 0 35px #000b, inset 0 0 0 3px #ffe5a0;
  transition: transform 4.4s cubic-bezier(.08, .75, .1, 1);
  background: conic-gradient(
    from -4.865deg,
    #bf2e40 0 9.73deg, #141722 9.73deg 19.46deg,
    #bf2e40 19.46deg 29.19deg, #141722 29.19deg 38.92deg,
    #bf2e40 38.92deg 48.65deg, #141722 48.65deg 58.38deg,
    #bf2e40 58.38deg 68.11deg, #141722 68.11deg 77.84deg,
    #bf2e40 77.84deg 87.57deg, #141722 87.57deg 97.3deg,
    #bf2e40 97.3deg 107.03deg, #141722 107.03deg 116.76deg,
    #bf2e40 116.76deg 126.49deg, #141722 126.49deg 136.22deg,
    #bf2e40 136.22deg 145.95deg, #141722 145.95deg 155.68deg,
    #bf2e40 155.68deg 165.41deg, #141722 165.41deg 175.14deg,
    #bf2e40 175.14deg 184.87deg, #141722 184.87deg 194.6deg,
    #bf2e40 194.6deg 204.33deg, #141722 204.33deg 214.06deg,
    #bf2e40 214.06deg 223.79deg, #141722 223.79deg 233.52deg,
    #bf2e40 233.52deg 243.25deg, #141722 243.25deg 252.98deg,
    #bf2e40 252.98deg 262.71deg, #141722 262.71deg 272.44deg,
    #bf2e40 272.44deg 282.17deg, #141722 282.17deg 291.9deg,
    #bf2e40 291.9deg 301.63deg, #141722 301.63deg 311.36deg,
    #bf2e40 311.36deg 321.09deg, #141722 321.09deg 330.82deg,
    #bf2e40 330.82deg 340.55deg, #141722 340.55deg 350.28deg,
    #16724e 350.28deg 360deg
  );
}
.wheelnumbers { position: absolute; inset: 0; pointer-events: none; }
.wheelnumbers span {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 24px;
  height: 24px;
  margin: -12px;
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 900;
  color: white;
  text-shadow: 0 2px 3px #000;
  transform: rotate(var(--a)) translateY(calc(-1 * var(--r))) rotate(calc(-1 * var(--a)));
}
.hub {
  position: absolute;
  z-index: 3;
  inset: 41%;
  border-radius: 50%;
  border: 5px solid #f1d08a;
  background: radial-gradient(circle, #fff0bd, #a6752c);
  display: grid;
  place-items: center;
  color: #251a0b;
  font-size: 26px;
}

/* Slots */
.slots { display: flex; gap: 10px; }
.reel {
  width: clamp(70px, 18vw, 110px);
  height: 115px;
  border: 4px solid #d6b66e;
  border-radius: 14px;
  background: linear-gradient(#fff0c4, #bb8f3c, #fff0bd);
  display: grid;
  place-items: center;
  font-size: 50px;
  color: #1a160e;
  box-shadow: inset 0 0 0 4px #3d2b15;
  transition: .15s;
}

/* Cards */
.cards { display: flex; justify-content: center; flex-wrap: wrap; gap: 9px; min-height: 105px; }
.card {
  width: 68px;
  height: 98px;
  border-radius: 9px;
  background: #f3f0e8;
  color: #222;
  padding: 7px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  font-size: 17px;
  font-weight: 900;
  box-shadow: 0 4px 12px #0005;
}
.card.red { color: #bf2945; }
.card .suit { text-align: center; font-size: 27px; }

/* Dice */
.dice { display: flex; gap: 14px; }
.die {
  width: 80px;
  height: 80px;
  background: #f3eee2;
  color: #222;
  border-radius: 15px;
  display: grid;
  place-items: center;
  font-size: 44px;
  box-shadow: 0 6px 16px #0005;
}

/* Mines */
.mines {
  display: grid;
  grid-template-columns: repeat(5, minmax(36px, 60px));
  gap: 8px;
  justify-content: center;
}
.cell {
  aspect-ratio: 1;
  border: 1px solid #4c536c;
  background: linear-gradient(145deg, #343b50, #171b28);
  border-radius: 9px;
  font-size: 23px;
  transition: .15s;
}
.cell:hover:not(:disabled) { border-color: var(--gold); }
.cell.open { background: #194738; border-color: var(--green); }
.cell.boom { background: #57232d; border-color: var(--red); }

/* History & forms */
.history { display: grid; gap: 8px; }
.histrow {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  background: #0b0d14;
  border: 1px solid #282c3a;
  border-radius: 10px;
  padding: 13px;
  font-size: 12px;
}
.positive { color: var(--green); }
.negative { color: var(--red); }
.formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.formfield label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.formfield input, .formfield select, .formfield textarea { width: 100%; }
.formfield textarea { min-height: 100px; resize: vertical; }

.notice {
  text-align: center;
  color: #777e91;
  font-size: 11px;
  margin: 28px 0 10px;
  line-height: 1.5;
}
.toast {
  position: fixed;
  z-index: 60;
  bottom: 30px;
  left: 50%;
  transform: translate(-50%, 20px);
  opacity: 0;
  transition: .25s;
  background: #202330;
  border: 1px solid #56505a;
  border-radius: 12px;
  padding: 13px 20px;
  max-width: 90%;
  text-align: center;
  pointer-events: none;
  font-weight: 600;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Rules panel */
.rules-panel {
  margin-top: 16px;
  background: linear-gradient(150deg, #191b26, #101118);
  border: 1px solid #303343;
  border-radius: 16px;
  padding: 18px;
}
.rules-panel h3 { margin-bottom: 8px; color: var(--gold); }
.rules-panel p { line-height: 1.65; color: #c5c8d4; margin: 0 0 10px; }

/* Mobile nav */
.mobile {
  display: none;
  position: fixed;
  z-index: 40;
  bottom: 0;
  left: 0;
  right: 0;
  justify-content: space-around;
  background: #090a0fee;
  backdrop-filter: blur(16px);
  border-top: 1px solid #ffffff13;
  padding: 7px 0 calc(7px + env(safe-area-inset-bottom));
}
.mobile button {
  font-size: 10px;
  padding: 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  color: var(--muted);
}
.mobile button span { font-size: 20px; }
.mobile button.active { color: var(--gold); }

/* Responsive */
@media (max-width: 980px) {
  .games { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .layout { grid-template-columns: 1fr; }
}
@media (max-width: 680px) {
  .app { padding: 0 12px 95px; }
  header { height: 64px; }
  .brand { font-size: 16px; letter-spacing: 1.5px; }
  .brand i { padding: 7px; margin-right: 4px; }
  nav { display: none; }
  .right { gap: 6px; }
  .balance { padding: 6px 8px; font-size: 11px; }
  .balance b { font-size: 13px; }
  .right > .primary { padding: 8px 10px; font-size: 12px; }
  .hero { padding: 24px 18px; margin-top: 14px; }
  .hero h1 { font-size: 36px; }
  .games { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .art { height: 115px; font-size: 48px; }
  .gameinfo { padding: 11px; }
  .stage, .controls, .panel { padding: 14px; }
  .arena { min-height: 300px; }
  .wheelwrap { width: min(340px, 84vw); }
  .formgrid { grid-template-columns: 1fr; }
  .mobile { display: flex; }
  .stats { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><i>✦</i>MADGEK</div>
    <nav>
      <button class="active" data-page="home" data-i18n="nav_home">Главная</button>
      <button data-page="games" data-i18n="nav_games">Игры</button>
      <button data-page="cash" data-i18n="nav_cash">Касса</button>
      <button data-page="history" data-i18n="nav_history">История</button>
      <button
